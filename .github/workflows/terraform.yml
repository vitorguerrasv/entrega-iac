name: Terraform CI/CD

on:
  workflow_dispatch:
    inputs:
      usuario:
        description: "Usuário da AWS Academy"
        required: true
        type: choice
        options:
          - VITOR
          - KEZIA
          - ERICA
          - IGOR
          - LEONARDO
      action:
        description: "Ação do Terraform"
        required: true
        type: choice
        options:
          - plan
          - plan/apply
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-dev-${{ inputs.usuario }}
  cancel-in-progress: false

jobs:
  terraform:
    if: inputs.action == 'plan' || inputs.action == 'plan/apply'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', inputs.usuario)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', inputs.usuario)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', inputs.usuario)] }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Get state bucket name
        run: echo "STATE_BUCKET=entrega-iac-terraform-state-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=entrega-iac/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Format
        run: terraform fmt -check -recursive ../..

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: inputs.action == 'plan/apply'
        run: terraform apply -input=false -auto-approve tfplan

  destroy:
    if: inputs.action == 'plan/apply'
    runs-on: ubuntu-latest
    environment: DESTROY
    defaults:
      run:
        working-directory: environments/dev

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets[format('AWS_ACCESS_KEY_ID_{0}', inputs.usuario)] }}
          aws-secret-access-key: ${{ secrets[format('AWS_SECRET_ACCESS_KEY_{0}', inputs.usuario)] }}
          aws-session-token: ${{ secrets[format('AWS_SESSION_TOKEN_{0}', inputs.usuario)] }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Get state bucket name
        run: echo "STATE_BUCKET=entrega-iac-terraform-state-$(aws sts get-caller-identity --query Account --output text)" >> "$GITHUB_ENV"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=entrega-iac/dev/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform Destroy
        run: terraform destroy -input=false -auto-approve
